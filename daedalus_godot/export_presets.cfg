; Export presets for Daedalus.
;
; The include_filter lines are the important part: .nova files are not
; Godot resources, so without them they are silently dropped from the .pck
; and the exported build ships with no ship stats, no enemy AI and no
; weapons logic at all. Every preset ships scripts_nova/*.nova -- the
; interpreter is GDScript (scripts/nova/) and reads them from res:// on
; every platform, which is why all three presets are the same shape. There
; is no Python in this project.

[preset.0]

name="macOS"
platform="macOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="scripts_nova/*.nova"
exclude_filter=""
export_path="../build/macos/Daedalus.app"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

export/distribution_type=0
binary_format/architecture="universal"
application/icon=""
application/icon_interpolation=4
application/bundle_identifier="com.example.daedalus"
application/signature=""
application/app_category="Games"
application/short_version=""
application/version=""
